<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Garden 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --rbx-bg-green: #b2d8b2;
            --rbx-card: rgba(220, 252, 231, 0.5); /* Glassmorphism dari file asli */
            --rbx-border: rgba(255, 255, 255, 0.4);
            --rbx-dark-green: #1a4d2e;
            --rbx-accent: #2d6a4f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', sans-serif;
            background-image: url('https://w0.peakpx.com/wallpaper/419/527/HD-wallpaper-roblox-green-nature-world.jpg'); 
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper { width: 100%; max-width: 550px; }

        /* HEADER SESUAI GAMBAR */
        .header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 3.2rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-shadow: 3px 3px 0px var(--rbx-accent);
        }

        /* CARD STYLE SESUAI GAMBAR */
        .card {
            background: var(--rbx-card);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1.5px solid var(--rbx-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* INPUTS */
        .label-text { font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px; display: block; opacity: 0.8; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            color: #1a4d2e;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--rbx-accent);
            color: white;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-disconnect { background: #1a4332; margin-top: 8px; }

        /* MODE SECTION */
        .mode-container { display: flex; justify-content: space-between; align-items: center; }
        .btn-mode-pill {
            padding: 8px 18px; border-radius: 20px; border: none;
            font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .btn-mode-pill.active { background: #1a4d2e; color: white; }
        .btn-mode-pill.inactive { background: rgba(255,255,255,0.3); color: #1a4d2e; }

        /* SENSOR GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .sensor-val { font-size: 2.2rem; font-weight: 700; margin: 10px 0; }
        .sensor-desc { font-size: 0.65rem; opacity: 0.8; }

        /* ACTUATOR */
        .actuator-card { text-align: center; }
        .pump-status { font-size: 1.8rem; font-weight: 900; margin-top: 10px; }

        /* TERMINAL ROBLOX STYLE */
        .terminal { background: #051610; border: 2px solid var(--rbx-accent); color: #4fcf70; border-radius: 20px; }
        .log-area { height: 140px; overflow-y: auto; padding: 15px; font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body>

        <div class="card-title"><i class="fas fa-cloud"></i> FireBase Cloud Sync</div>
        <span class="label-text">API KEY</span>
        <input type="password" id="fb-apiKey">
        <span class="label-text">DATABASE URL</span>
        <input type="text" id="fb-dbUrl">
        <span class="label-text">NODEPATH</span>
        <input type="text" id="fb-path">
        <button class="btn" id="btn-connect-fb"><i class="fas fa-link"></i> Connect FireBase</button>
    </div>

    <div class="card">
        <div class="card-title"><i class="fab fa-bluetooth-b"></i> Micro:Bit Bluetooth</div>
        <p style="font-size: 0.7rem; margin-bottom: 10px;">Pastikan Bluetooth UART aktif di Micro:bit.</p>
        <button class="btn" id="btn-connect-ble"><i class="fas fa-plug"></i> Connect Micro:Bit</button>
        <button class="btn btn-disconnect" id="btn-disconnect-ble" disabled>Disconnect</button>
    </div>
