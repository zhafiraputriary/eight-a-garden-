<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Garden - Smart Garden 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            /* Palette warna sesuai gambar Eight Garden */
            --bg-color: #98d99d; /* Hijau dasar */
            --card-glass: rgba(167, 243, 208, 0.7); /* Efek kaca hijau muda */
            --dark-green: #14532d;
            --mint: #6ee7b7;
            --accent: #059669;
            --terminal-bg: #052e16;
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2) 0%, transparent 50%);
            color: var(--dark-green);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px; /* Layout dibuat ramping sesuai referensi gambar */
            margin: 0 auto;
        }

        /* Judul Utama */
        .main-title {
            text-align: center;
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 3px 3px 0px var(--dark-green);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .main-title span { color: #facc15; } /* Warna icon stroberi/buah */

        /* Card Style */
        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Input & Form */
        label { display: block; font-size: 0.75rem; font-weight: 700; color: white; margin-bottom: 5px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.5);
            margin-bottom: 10px;
            font-family: inherit;
            color: var(--dark-green);
        }

        /* Button Style */
        .btn {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { background: var(--dark-green); transform: translateY(-2px); }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* Mode Banner */
        .mode-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-glass);
            padding: 15px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .mode-btn-group { display: flex; gap: 5px; }
        .btn-pill {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-pill.active { background: #059669; color: white; }
        .btn-pill.inactive { background: white; color: #059669; opacity: 0.6; }

        /* Sensor Display (Sesuai Gambar) */
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .sensor-item {
            background: var(--card-glass);
            border-radius: var(--radius);
            padding: 20px;
            text-align: left;
            position: relative;
        }
        .sensor-item .icon { font-size: 1.5rem; margin-bottom: 10px; }
        .sensor-val { font-size: 2.5rem; font-weight: 900; color: white; margin: 5px 0; }
        .sensor-unit { font-size: 1rem; opacity: 0.8; }

        /* Aktuator Section */
        .aktuator-card {
            background: var(--card-glass);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .aktuator-icon { font-size: 3rem; margin-bottom: 15px; }

        /* Terminal */
        .terminal {
            background: var(--terminal-bg);
            border-radius: var(--radius);
            padding: 15px;
            color: #10b981;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            height: 150px;
            overflow-y: auto;
            margin-top: 20px;
            border: 4px solid var(--dark-green);
        }

        /* Status Floating */
        .status-float {
            position: fixed; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 100;
        }
        .badge { font-size: 10px; padding: 5px 12px; border-radius: 20px; background: white; font-weight: 800; }
        .badge.online { color: #059669; }

        /* Responsive */
        @media (max-width: 480px) {
            .sensor-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="status-float">
    <div class="badge" id="status-bt">BT Offline</div>
    <div class="badge" id="status-fb">DB Offline</div>
</div>

<div class="container">
    <h1 class="main-title">Eight 🍓 Garden</h1>

    <div class="sensor-grid">
        <div class="glass-card">
            <div class="card-header"><i class="fas fa-cloud"></i> Firebase Sync</div>
            <label>API Key</label>
            <input type="password" id="fb-apiKey" placeholder="...">
            <label>DB URL</label>
            <input type="text" id="fb-dbUrl">
            <label>Path</label>
            <input type="text" id="fb-path">
            <button class="btn" id="btn-connect-fb">Connect</button>
        </div>

        <div class="glass-card">
            <div class="card-header"><i class="fas fa-bluetooth"></i> Bluetooth</div>
            <p style="font-size: 0.7rem; color: white; margin-bottom: 10px;">Pastikan Bluetooth UART aktif di Micro:bit</p>
            <button class="btn" id="btn-connect-ble" style="margin-bottom: 10px;">Connect</button>
            <button class="btn" id="btn-disconnect-ble" disabled style="background: #1e293b;">Disconnect</button>
        </div>
    </div>

    <div class="mode-container">
        <div>
            <h4 style="color: white;">System Mode</h4>
            <p style="font-size: 0.7rem; color: white;">Automatic / Manual Control</p>
        </div>
        <div class="mode-btn-group">
            <button class="btn-pill" id="btn-set-auto">Automatic</button>
            <button class="btn-pill" id="btn-set-manual">Manual</button>
        </div>
    </div>

    <div class="sensor-grid">
        <div class="sensor-item">
            <div class="card-header"><i class="fas fa-rss"></i> Ultrasonic 1</div>
            <div class="icon">🚀</div>
            <div class="sensor-val" id="val-jarak">--</div>
            <div style="font-size: 0.6rem; color: white;">Pin P0/P1 - Water Level</div>
        </div>
        <div class="sensor-item">
            <div class="card-header"><i class="fas fa-tint"></i> Ultrasonic 2</div>
            <div class="icon">💧</div>
            <div class="sensor-val" id="val-jarak-manual">--</div>
            <div style="font-size: 0.6rem; color: white;">Pin P3/P8 - Ember</div>
        </div>
    </div>

    <div class="aktuator-card" style="margin-top: 20px;">
        <div class="card-header" style="justify-content: center;"><i class="fas fa-bolt"></i> Aktuator</div>
        <div class="aktuator-icon" id="icon-relay">⚡</div>
        <p>P13: Kontrol Pompa</p>
        <h2 id="lbl-relay" style="margin: 10px 0; font-size: 2rem;">OFF</h2>
        
        <div id="manual-relay" style="display:none; margin-top: 15px;">
            <button class="btn" id="btn-toggle-relay-manual" style="background: white; color: var(--dark-green);">TOGGLE PUMP</button>
        </div>
    </div>

    <div class="terminal" id="terminalLog"></div>
    <button id="btnClearLog" style="background:none; border:none; color:white; font-size: 10px; cursor: pointer; margin-top: 5px;">Clear Log</button>

</div>

<script type="module">
import { initializeApp, getApps, deleteApp }     from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const state = {
    db: null, path: "", unsub: null, data: {},
    device: null, txChar: null, rxChar: null,
    bleConnected: false, bleBuffer: "",
    modeOtomatis: 1,
    charts: {},
    history: { jarak: { labels: [], data: [] }, jarak_manual: { labels: [], data: [] } }
};

const $ = id => document.getElementById(id);

// Logger
function log(msg, color = "#10b981") {
    const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
    $('terminalLog').insertAdjacentHTML('afterbegin', `<div style="color:${color}">[${t}] ${msg}</div>`);
}

// Mode UI Updates
function applyMode(isAuto) {
    state.modeOtomatis = isAuto ? 1 : 0;
    if (isAuto) {
        $('btn-set-auto').className = 'btn-pill active';
        $('btn-set-manual').className = 'btn-pill inactive';
        $('manual-relay').style.display = 'none';
    } else {
        $('btn-set-auto').className = 'btn-pill inactive';
        $('btn-set-manual').className = 'btn-pill active';
        $('manual-relay').style.display = 'block';
    }
    sendBLE("mode", isAuto ? 1 : 0);
    if (state.db) update(ref(state.db, `${state.path}/mode`), { value: isAuto ? 1 : 0 });
}

$('btn-set-auto').onclick = () => applyMode(true);
$('btn-set-manual').onclick = () => applyMode(false);

// Logic Relay
function updateRelayUI(isOn) {
    $('lbl-relay').textContent = isOn ? 'ON' : 'OFF';
    $('lbl-relay').style.color = isOn ? '#facc15' : 'white';
    $('icon-relay').style.opacity = isOn ? '1' : '0.3';
}

// Update UI Sensor
function updateSensorUI(key, val) {
    const el = $(key === 'jarak_manual' ? 'val-jarak-manual' : `val-${key}`);
    if (el) el.innerHTML = `${val}<span style="font-size:1rem">cm</span>`;
}

// Bluetooth Logic (Sama seperti kode asli)
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

async function connectBLE() {
    try {
        state.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [SVC]
        });
        const server  = await state.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        state.txChar  = await service.getCharacteristic(TX);
        state.rxChar  = await service.getCharacteristic(RX);
        await state.txChar.startNotifications();
        state.txChar.addEventListener("characteristicvaluechanged", onBLEData);
        state.bleConnected = true;
        $('status-bt').className = 'badge online';
        $('status-bt').textContent = 'BT Connected';
        $('btn-disconnect-ble').disabled = false;
        log("✓ Connected to Micro:bit");
    } catch (e) { log("BLE Error: " + e.message, "red"); }
}

function onBLEData(event) {
    let arr = [];
    for (let i = 0; i < event.target.value.byteLength; i++) arr.push(event.target.value.getUint8(i));
    state.bleBuffer += String.fromCharCode.apply(null, arr);
    const lines = state.bleBuffer.split('\n');
    state.bleBuffer = lines.pop() || "";
    lines.forEach(line => { processBLELine(line.trim()); });
}

function processBLELine(txt) {
    if (!txt.includes(',')) return;
    const [key, valStr] = txt.split(',');
    const val = parseFloat(valStr);
    if (key === "Relay") updateRelayUI(val === 1);
    if (key === "jarak" || key === "jarak_manual") updateSensorUI(key, val);
}

async function sendBLE(key, val) {
    if (!state.rxChar) return;
    const payload = `${key},${val}\n`;
    await state.rxChar.writeValue(new TextEncoder().encode(payload));
}

// Relay Manual Toggle
$('btn-toggle-relay-manual').onclick = () => {
    const currentState = $('lbl-relay').textContent === 'ON';
    const nextState = !currentState;
    updateRelayUI(nextState);
    sendBLE("Relay", nextState ? 1 : 0);
};

// Firebase Logic (Sama seperti kode asli)
async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const dbUrl  = $('fb-dbUrl').value.trim();
    const path   = $('fb-path').value.trim() || "smarthome/ruangan1";

    try {
        const app = initializeApp({ apiKey, databaseURL: dbUrl, projectId: "smart-garden" });
        state.db = getDatabase(app);
        state.path = path;
        onValue(ref(state.db, path), (snap) => {
            const d = snap.val();
            if (d) {
                if (d.jarak) updateSensorUI("jarak", d.jarak.value);
                if (d.jarak_manual) updateSensorUI("jarak_manual", d.jarak_manual.value);
                if (d.relay) updateRelayUI(d.relay.value === 1);
                if (d.mode) applyMode(d.mode.value === 1);
            }
        });
        $('status-fb').className = 'badge online';
        $('status-fb').textContent = 'DB Synced';
        log("✓ Firebase Connected");
    } catch (e) { log("DB Error: " + e.message, "red"); }
}

$('btn-connect-ble').onclick = connectBLE;
$('btn-connect-fb').onclick = connectFirebase;
$('btnClearLog').onclick = () => $('terminalLog').innerHTML = '';

window.onload = () => {
    applyMode(true);
    // Auto-fill if saved
    const saved = JSON.parse(localStorage.getItem('smarthome_cfg') || '{}');
    if (saved.apiKey) {
        $('fb-apiKey').value = saved.apiKey;
        $('fb-dbUrl').value = saved.dbUrl;
        $('fb-path').value = saved.path;
    }
};
</script>
</body>
</html>
