<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Garden - Smart Control 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #b4d9bc;
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #1e3a2b;
            --accent: #2d6a4f;
            --btn-green: #1a4332;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-base) url('https://w0.peakpx.com/wallpaper/419/527/HD-wallpaper-roblox-green-nature-world.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-blend-mode: overlay;
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 550px; }

        /* HEADER */
        .main-header {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 3px 3px 0px var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* CARD GLASSMORPHISM */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1.5px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 15px;
            color: #fff;
        }

        /* INPUTS */
        .label-text { font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; display: block; opacity: 0.9; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--text-main);
        }
