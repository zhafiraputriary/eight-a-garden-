<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Garden - Roblox Edition 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --rbx-green: #4fcf70;
            --rbx-dark-green: #3a9b53;
            --rbx-light-green: #98fb98;
            --rbx-blue: #00a2ff;
            --rbx-yellow: #ffcf00;
            --rbx-white: #ffffff;
            --rbx-ui-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0px 6px 0px rgba(0, 0, 0, 0.15);
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #87ceeb; /* Sky blue background */
            background-image: radial-gradient(circle at 50% 50%, #b0f2b4 0%, #87ceeb 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .wrapper {
            max-width: 500px;
            margin: 0 auto;
        }

        /* HEADER ALIAS TITLE GAME */
        .game-header {
            text-align: center;
            margin-bottom: 30px;
            filter: drop-shadow(4px 4px 0px #2a6d3a);
        }
        .game-title {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: var(--rbx-white);
            -webkit-text-stroke: 2px #2a6d3a;
            letter-spacing: 2px;
        }

        /* CARD STYLE - ROBLOX UI VIBE */
        .rbx-card {
            background: var(--rbx-ui-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 4px solid var(--rbx-white);
            box-shadow: var(--shadow);
            position: relative;
        }

        .rbx-label {
            font-family: 'Fredoka One', cursive;
            color: var(--rbx-dark-green);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }

        /* INPUTS */
        input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: 3px solid #ddd;
            margin-bottom: 10px;
            font-family: inherit;
            font-weight: 900;
        }

        /* BUTTONS - CHUNKY LOOK */
        .rbx-btn {
            font-family: 'Fredoka One', cursive;
            background: var(--rbx-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            border-bottom: 6px solid var(--rbx-dark-green);
            width: 100%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.1s;
            margin-top: 5px;
        }
        .rbx-btn:active {
            transform: translateY(4px);
            border-bottom: 2px solid var(--rbx-dark-green);
        }
        .rbx-btn-blue { background: var(--rbx-blue); border-bottom-color: #007acc; }

        /* SENSOR GRID */
        .sensor-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .sensor-box {
            background: white;
            border-radius: var(--radius);
            padding: 15px;
            text-align: center;
            border: 3px solid var(--rbx-green);
            box-shadow: 0px 4px 0px var(--rbx-green);
        }
        .sensor-val {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: var(--rbx-dark-green);
        }
        .sensor-icon { font-size: 2rem; margin-bottom: 5px; }

        /* MODE TOGGLE */
        .mode-switch {
            display: flex;
            background: #eee;
            border-radius: 30px;
            padding: 5px;
            margin-top: 10px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border-radius: 25px;
            border: none;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            background: transparent;
            color: #888;
        }
        .mode-btn.active {
            background: var(--rbx-yellow);
            color: #554400;
            box-shadow: 0px 3px 0px #bca000;
        }

        /* ACTUATOR SECTION */
        .pump-card {
            text-align: center;
            padding: 25px;
        }
        .pump-status {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin: 10px 0;
            color: #ccc;
        }
        .pump-status.on { color: var(--rbx-blue); }

        /* TERMINAL ROBLOX CHAT STYLE */
        .chat-log {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.8rem;
            color: white;
            font-weight: 700;
            margin-top: 20px;
        }

        .status-pill {
            position: fixed; top: 15px; right: 15px;
            background: var(--rbx-white); padding: 5px 15px;
            border-radius: 20px; font-weight: 900; font-size: 0.7rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100; display: flex; gap: 10px;
        }
    </style>
</head>
<body>

<div class="status-pill">
    <span id="status-bt">BT: 🔴</span>
    <span id="status-fb">DB: 🔴</span>
</div>

<div class="wrapper">
    <div class="game-header">
        <h1 class="game-title">Eight Garden</h1>
    </div>

    <div class="rbx-card">
        <span class="rbx-label">CLOUD CONFIG</span>
        <input type="password" id="fb-apiKey" placeholder="Firebase API Key">
        <input type="text" id="fb-dbUrl" placeholder="Database URL">
        <input type="text" id="fb-path" placeholder="Path (e.g. garden/1)">
        <button class="rbx-btn rbx-btn-blue" id="btn-connect-fb">LINK DATABASE</button>
        <hr style="margin:15px 0; border:1px solid #eee;">
        <button class="rbx-btn" id="btn-connect-ble">PAIR MICRO:BIT</button>
        <button class="rbx-btn" id="btn-disconnect-ble" style="background:#ff4747; border-bottom-color:#b32d2d; margin-top:5px;" disabled>DISCONNECT</button>
    </div>

    <div class="rbx-card">
        <span class="rbx-label">SYSTEM MODE</span>
        <div class="mode-switch">
            <button class="mode-btn" id="btn-auto">AUTOMATIC</button>
            <button class="mode-btn" id="btn-manual">MANUAL</button>
        </div>
    </div>

    <div class="sensor-container">
        <div class="sensor-box">
            <div class="sensor-icon">🚀</div>
            <div class="rbx-label">WATER LVL</div>
            <div class="sensor-val" id="val-jarak">--</div>
            <small>P0/P1</small>
        </div>
        <div class="sensor-box">
            <div class="sensor-icon">💧</div>
            <div class="rbx-label">RESERVOIR</div>
            <div class="sensor-val" id="val-jarak-manual">--</div>
            <small>P3/P8</small>
        </div>
    </div>

    <div class="rbx-card pump-card">
        <span class="rbx-label">WATER PUMP</span>
        <div id="pump-icon" style="font-size: 3rem;">☁️</div>
        <div class="pump-status" id="lbl-relay">OFF</div>
        <div id="manual-controls" style="display:none;">
            <button class="rbx-btn rbx-btn-blue" id="btn-pump-toggle">TOGGLE PUMP</button>
        </div>
    </div>

    <div class="chat-log" id="terminalLog"></div>
</div>

<script type="module">
import { initializeApp, getApps, deleteApp }     from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const state = {
    db: null, path: "", unsub: null, 
    device: null, txChar: null, rxChar: null,
    bleConnected: false, bleBuffer: "",
    modeOtomatis: 1
};

const $ = id => document.getElementById(id);

function log(msg, color = "white") {
    const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
    $('terminalLog').insertAdjacentHTML('afterbegin', `<div style="color:${color}">[${t}] ${msg}</div>`);
}

// Mode Application
function applyMode(isAuto) {
    state.modeOtomatis = isAuto ? 1 : 0;
    $('btn-auto').className = isAuto ? 'mode-btn active' : 'mode-btn';
    $('btn-manual').className = !isAuto ? 'mode-btn active' : 'mode-btn';
    $('manual-controls').style.display = isAuto ? 'none' : 'block';
    
    sendBLE("mode", isAuto ? 1 : 0);
    if (state.db) update(ref(state.db, `${state.path}/mode`), { value: isAuto ? 1 : 0 });
}

$('btn-auto').onclick = () => applyMode(true);
$('btn-manual').onclick = () => applyMode(false);

// Relay UI
function updateRelayUI(isOn) {
    $('lbl-relay').textContent = isOn ? 'ON' : 'OFF';
    $('lbl-relay').className = isOn ? 'pump-status on' : 'pump-status';
    $('pump-icon').textContent = isOn ? '🌊' : '☁️';
}

// Sensor UI
function updateSensorUI(key, val) {
    const el = $(key === 'jarak_manual' ? 'val-jarak-manual' : `val-${key}`);
    if (el) el.textContent = val;
}

// BLE Bluetooth Logic
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

async function connectBLE() {
    try {
        state.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [SVC]
        });
        const server = await state.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        state.txChar = await service.getCharacteristic(TX);
        state.rxChar = await service.getCharacteristic(RX);
        await state.txChar.startNotifications();
        state.txChar.addEventListener("characteristicvaluechanged", onBLEData);
        state.bleConnected = true;
        $('status-bt').textContent = 'BT: 🟢';
        $('btn-disconnect-ble').disabled = false;
        log("System: Micro:bit Connected!");
    } catch (e) { log("Error: " + e.message, "#ff4747"); }
}

function onBLEData(event) {
    let arr = [];
    for (let i = 0; i < event.target.value.byteLength; i++) arr.push(event.target.value.getUint8(i));
    state.bleBuffer += String.fromCharCode.apply(null, arr);
    const lines = state.bleBuffer.split('\n');
    state.bleBuffer = lines.pop() || "";
    lines.forEach(line => { processBLELine(line.trim()); });
}

function processBLELine(txt) {
    if (!txt.includes(',')) return;
    const [key, valStr] = txt.split(',');
    const val = parseFloat(valStr);
    if (key === "Relay") updateRelayUI(val === 1);
    if (key === "jarak" || key === "jarak_manual") updateSensorUI(key, val);
}

async function sendBLE(key, val) {
    if (!state.rxChar) return;
    const payload = `${key},${val}\n`;
    await state.rxChar.writeValue(new TextEncoder().encode(payload));
}

$('btn-pump-toggle').onclick = () => {
    const isNowOn = $('lbl-relay').textContent === 'OFF';
    updateRelayUI(isNowOn);
    sendBLE("Relay", isNowOn ? 1 : 0);
};

// Firebase Logic
async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const dbUrl  = $('fb-dbUrl').value.trim();
    const path   = $('fb-path').value.trim() || "smarthome/ruangan1";
    try {
        const app = initializeApp({ apiKey, databaseURL: dbUrl, projectId: "roblox-garden" });
        state.db = getDatabase(app);
        state.path = path;
        onValue(ref(state.db, path), (snap) => {
            const d = snap.val();
            if (d) {
                if (d.jarak) updateSensorUI("jarak", d.jarak.value);
                if (d.jarak_manual) updateSensorUI("jarak_manual", d.jarak_manual.value);
                if (d.relay) updateRelayUI(d.relay.value === 1);
                if (d.mode) applyMode(d.mode.value === 1);
            }
        });
        $('status-fb').textContent = 'DB: 🟢';
        log("System: Firebase Linked!");
    } catch (e) { log("Error: " + e.message, "#ff4747"); }
}

$('btn-connect-ble').onclick = connectBLE;
$('btn-connect-fb').onclick = connectFirebase;

window.onload = () => {
    applyMode(true);
};
</script>
</body>
</html>
