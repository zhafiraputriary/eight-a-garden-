<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Garden - Roblox Edition 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --rbx-green: #4fcf70;
            --rbx-dark-green: #3a9b53;
            --rbx-light-green: #98fb98;
            --rbx-blue: #00a2ff;
            --rbx-yellow: #ffcf00;
            --rbx-white: #ffffff;
            --rbx-ui-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0px 6px 0px rgba(0, 0, 0, 0.15);
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #87ceeb; /* Sky blue background */
            background-image: radial-gradient(circle at 50% 50%, #b0f2b4 0%, #87ceeb 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .wrapper {
            max-width: 500px;
            margin: 0 auto;
        }

        /* HEADER ALIAS TITLE GAME */
        .game-header {
            text-align: center;
            margin-bottom: 30px;
            filter: drop-shadow(4px 4px 0px #2a6d3a);
        }
        .game-title {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: var(--rbx-white);
            -webkit-text-stroke: 2px #2a6d3a;
            letter-spacing: 2px;
        }

        /* CARD STYLE - ROBLOX UI VIBE */
        .rbx-card {
            background: var(--rbx-ui-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 4px solid var(--rbx-white);
            box-shadow: var(--shadow);
            position: relative;
        }

        .rbx-label {
            font-family: 'Fredoka One', cursive;
            color: var(--rbx-dark-green);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }

        /* INPUTS */
        input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: 3px solid #ddd;
            margin-bottom: 10px;
            font-family: inherit;
            font-weight: 900;
        }

        /* BUTTONS - CHUNKY LOOK */
        .rbx-btn {
            font-family: 'Fredoka One', cursive;
            background: var(--rbx-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            border-bottom: 6px solid var(--rbx-dark-green);
            width: 100%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.1s;
            margin-top: 5px;
        }
        .rbx-btn:active {
            transform: translateY(4px);
            border-bottom: 2px solid var(--rbx-dark-green);
        }
        .rbx-btn-blue { background: var(--rbx-blue); border-bottom-color: #007acc; }

        /* SENSOR GRID */
        .sensor-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .sensor-box {
            background: white;
            border-radius: var(--radius);
            padding: 15px;
            text-align: center;
            border: 3px solid var(--rbx-green);
            box-shadow: 0px 4px 0px var(--rbx-green);
        }
        .sensor-val {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: var(--rbx-dark-green);
        }
        .sensor-icon { font-size: 2rem; margin-bottom: 5px; }
